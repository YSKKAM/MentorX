version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: classroom_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-classroom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - classroom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: classroom_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-classroom_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_in_production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - classroom_network

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: classroom_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3001/api}
      - NEXT_PUBLIC_SOCKET_URL=${SOCKET_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - classroom_network

volumes:
  postgres_data:

networks:
  classroom_network:
    driver: bridge
