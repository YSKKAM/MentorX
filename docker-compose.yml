services:
  postgres:
    image: postgres:16-alpine
    container_name: classroom-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: classroom_user
      POSTGRES_PASSWORD: classroom_pass
      POSTGRES_DB: classroom_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_user -d classroom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
